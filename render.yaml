# OneInbox Render Blueprint
# Render hosts only the web service.
# The daily digest runs as the GitHub Actions workflow .github/workflows/daily_digest.yml (01:30 UTC = 07:00 IST), not a Render cron job.
services:
  - type: web
    name: oneinbox-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: DIGEST_TOKEN
        sync: false
      - key: FEEDBACK_SECRET
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_ASSISTANT_ID
        sync: false
      - key: TINKER_API_KEY
        sync: false
      # Note: APP_BASE_URL must be set to the deployed web service URL
      - key: APP_BASE_URL
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.3
