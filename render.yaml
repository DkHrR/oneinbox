services:
  - type: web
    name: oneinbox-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: DIGEST_TOKEN
        sync: false
      - key: FEEDBACK_SECRET
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_ASSISTANT_ID
        sync: false
      - key: TINKER_API_KEY
        sync: false
      - key: NTFY_TOPIC
        sync: false
      # Note: APP_BASE_URL must be set to the deployed web service URL
      - key: APP_BASE_URL
        sync: false
      - key: INGEST_TOKEN
        sync: false

  - type: cron
    name: oneinbox-daily-digest
    runtime: python
    plan: starter
    schedule: "30 1 * * *" # 1:30 UTC = 7:00 IST daily
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: TINKER_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_ASSISTANT_ID
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: DIGEST_TOKEN
        sync: false
      - key: FEEDBACK_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
